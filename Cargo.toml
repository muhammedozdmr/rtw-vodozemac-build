[package]
name = "kinsh-vodozemac-wasm"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Browser/Node WASM bindings for vodozemac (Olm + Megolm primitives), tailored for non-Matrix chat use"
repository = "https://github.com/Meneleus/vodozemac-bindings"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# RTW: tam surum (`=`). 0.11.2 RUSTSEC-2026-0510/0451/0445 duzeltmelerini tasir.
# `wasm_js`: vodozemac 0.11 rastgeleligi getrandom 0.4'ten alir; wasm32-unknown-unknown
# icin Web Crypto (`crypto.getRandomValues`) arka ucunu bu ozellik acar. getrandom 0.4'te
# ayrica `--cfg getrandom_backend` GEREKMEZ (yalniz 0.3 istiyordu). Yerel hedeflerde etkisiz.
vodozemac = { version = "=0.11.2", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
# RTW: tek kod uretim birimi — paralel kod uretiminin sirasi ciktiyi degistirmesin
# (yeniden uretilebilir derleme).
codegen-units = 1

# RTW: wasm-opt (binaryen) KAPALI. wasm-pack onu ayrica indirir ve surumu Cargo.lock'ta
# sabitlenmez; ciktiyi degistirdigi icin iki derlemenin ayni ikiliyi uretmesini bozar.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Workspace — the root crate above remains the wasm-bindgen target for
# pkg-web / pkg-node. The new member is the UniFFI-based crate that powers
# the React Native native bridge (iOS xcframework + Android AAR).
[workspace]
members = ["crates/vodozemac-ffi"]
